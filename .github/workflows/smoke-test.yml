name: Smoke Test

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install software rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Run client smoke test
        timeout-minutes: 25
        run: |
          # Pre-seed options so first-boot onboarding screens don't block the title.
          mkdir -p run
          printf 'lang:en_us\ntutorialStep:none\nonboardAccessibility:false\n' > run/options.txt
          # No GPU on runners: Mesa lavapipe (Vulkan) / llvmpipe (GL) is auto-selected.
          # Loom wraps the game launch in xvfb-run itself, so no display setup is needed.
          export LIBGL_ALWAYS_SOFTWARE=1
          export JAVA_TOOL_OPTIONS="-Dexeter.smokeTest=true"
          ./gradlew runClient --args="--demo" > smoke.log 2>&1 &
          echo $! > client.pid
          # Markers are written directly by the game to run/smoke-markers.log;
          # smoke.log is only reliable after shutdown (Gradle output buffering).
          for i in $(seq 1 200); do
            sleep 5
            grep -q "sequence complete" run/smoke-markers.log 2>/dev/null && break
          done
          # The game stops itself after the sequence; allow orderly shutdown.
          sleep 20
          # Backstop: the game is forked under the daemon, kill its JVM directly.
          pkill -f "devlaunchinjector" 2>/dev/null || true
          sleep 5
          kill "$(cat client.pid)" 2>/dev/null || true
          wait 2>/dev/null || true
          exit 0

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            smoke.log
            run/smoke-markers.log
            run/screenshots/smoke-*.png
          if-no-files-found: warn

      - name: Assert smoke results
        run: |
          LOG=run/smoke-markers.log
          grep -q "Exeter] Initialized" smoke.log || (echo "::error::Exeter did not initialize" && exit 1)
          grep -q "pressed Play Demo World" $LOG || (echo "::error::demo world was not joined" && exit 1)
          grep -q "close ClickGUI, screen=.*clickgui.ClickGui" $LOG || (echo "::error::ClickGUI did not open" && exit 1)
          grep -q "close HUDEditor, screen=.*hud.HudEditorScreen" $LOG || (echo "::error::HUDEditor did not open" && exit 1)
          grep -q "close windows, screen=.*window.WindowScreen" $LOG || (echo "::error::Windows did not open" && exit 1)
          grep -q "sequence complete" $LOG || (echo "::error::smoke sequence did not complete" && exit 1)
          test "$(ls run/screenshots/smoke-*.png 2>/dev/null | wc -l)" -eq 3 || (echo "::error::expected 3 GUI screenshots" && exit 1)
          if grep -Eq "Failed to load config|NullPointerException|Minecraft Crash Report|Mixin apply failed" smoke.log; then
            echo "::error::errors found in smoke log"
            grep -E "Failed to load config|NullPointerException|Minecraft Crash Report|Mixin apply failed" smoke.log
            exit 1
          fi
