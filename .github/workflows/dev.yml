name: Dev Build

on:
  push:
    branches:
      - 'newbase'

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Delete old dev release
        run: gh release delete dev --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dev release
        run: gh release create dev build/libs/*.jar --title "Dev Build" --generate-notes --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
