name: Build & Release

# Builds EVERY branch on every push. The jar artifact is attached to each run,
# and pushes to the default branch additionally produce a GitHub Release.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile must pass on every branch)
        run: ./gradlew build -x test --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: exeter-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    # Release only from the default branch (master).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew build -x test --no-daemon

      - name: Read version
        id: ver
        run: echo "version=$(grep -E '^modVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ver.outputs.version }}
          name: "Latest build (master)"
          prerelease: false
          make_latest: true
          body: |
            Automated rolling build of `master` @ ${{ github.sha }}.
            - Built: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.event.head_commit.message }}
          files: build/libs/*.jar
