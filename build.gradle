plugins {
    id 'babric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

loom {
    gluedMinecraftJar()
    customMinecraftManifest.set("https://babric.github.io/manifest-polyfill/${minecraft_version}.json")
    intermediaryUrl.set("https://maven.glass-launcher.net/babric/babric/intermediary/%1\$s/intermediary-%1\$s-v2.jar")
}

def git(String... args) {
    try {
        def pb = new ProcessBuilder(["git"] + (args as List))
        pb.directory(projectDir)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        def output = new String(proc.inputStream.readAllBytes()).trim()
        proc.waitFor()
        return proc.exitValue() == 0 ? output : null
    } catch (ignored) {
        return null
    }
}

def getHash() {
    def gitFolder = "$projectDir/.git/"
    def takeFromHash = 16
    def head = new File(gitFolder + "HEAD").text.split(":")
    def isCommit = head.length == 1

    if (isCommit) return head[0].trim().take(takeFromHash)

    def refHead = new File(gitFolder + head[1].trim())
    refHead.text.trim().take takeFromHash
}

def getBuild() {
    String tag = git("describe", "--tags", "--abbrev=0", "--exclude=dev")
    String commitSinceTag = tag != null ? git("rev-list", "${tag}..HEAD", "--count") : null
    return "${tag ?: 'unknown'}-mc${project.minecraft_version}+${commitSinceTag ?: '0'}"
}

def generatedSourcesDir = file("${buildDir}/generated/sources/me.friendly.exeter")

sourceSets.main {
    java.srcDir generatedSourcesDir
}

task generateBuildInfo {
    description = 'Generates BuildInfo.java with git commit info'
    outputs.upToDateWhen { false }

    doLast {
        def hashVal = getHash()
        def buildVal = getBuild()

        def statusOut = git("status", "--porcelain")
        def dirty = statusOut != null && !statusOut.trim().isEmpty()

        def pkg = new File(generatedSourcesDir, "me/friendly/exeter")
        pkg.mkdirs()
        def out = new File(pkg, "BuildInfo.java")
        out.text = """\
package me.friendly.exeter;

public final class BuildInfo {
    public static final String HASH = "${hashVal}";
    public static final String BUILD = "${buildVal}";
    public static final boolean DIRTY = ${dirty};

    private BuildInfo() {}
}
"""
    }
}

compileJava.dependsOn generateBuildInfo

repositories {
    maven {
        name = 'Babric'
        url = 'https://maven.glass-launcher.net/babric'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "babric:barn:${project.yarn_mappings}:v2"
    modImplementation "babric:fabric-loader:${project.loader_version}"

    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.16.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.moandjiezana.toml:toml4j:0.7.2"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
