plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

group project.modGroup
version project.modVersion

base {
    archivesName = project.modBaseName
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

def git(String... args) {
    try {
        def pb = new ProcessBuilder(["git"] + (args as List))
        pb.directory(projectDir)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        def output = new String(proc.inputStream.readAllBytes()).trim()
        proc.waitFor()
        return proc.exitValue() == 0 ? output : null
    } catch (ignored) {
        return null
    }
}

def getHash() {
    def gitFolder = "$projectDir/.git/"
    def takeFromHash = 16
    def head = new File(gitFolder + "HEAD").text.split(":") // .git/HEAD
    def isCommit = head.length == 1

    if(isCommit) return head[0].trim().take(takeFromHash)

    def refHead = new File(gitFolder + head[1].trim())
    refHead.text.trim().take takeFromHash
}
String hash = getHash()

def getBuild() {
    String tag = git("tag")
    if (tag != null && tag.contains("\n")) {
        tag = tag.split("\n")[0]
    }
    String commitSinceTag = tag != null ? git("rev-list", "${tag}..HEAD", "--count") : null
    return "${tag ?: 'unknown'}+${commitSinceTag ?: '0'}"
}
String build = getBuild()

boolean isDirty = false
def statusOutput = git("status", "--porcelain")
if (statusOutput != null && !statusOutput.trim().isEmpty()) {
    isDirty = true
}

compileJava {
    // from sn0w
    String contents = ""
    File update = file 'src/main/java/me/larp/client/core/Larp.java'
    contents = update.getText( 'UTF-8' )
    contents = contents.replaceAll( 'HASH = "(.*?)"', 'HASH = "' + hash + '"' )
    contents = contents.replaceAll( 'BUILD = "(.*?)"', 'BUILD = "' + build + '"' )
    contents = contents.replaceAll( 'DIRTY = (.*?)$', 'DIRTY = ' + isDirty )
    update.write( contents, 'UTF-8' )
}

repositories {
    mavenCentral()
    maven {
        name = 'fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/maven/'
    }
    maven {
        name = 'meteor-maven'
        url = 'https://maven.meteordev.org/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "meteordevelopment:discord-ipc:1.1"
    include "meteordevelopment:discord-ipc:1.1"
    implementation "com.google.code.gson:gson:2.11.0"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(
                'MixinConfigs': 'mixins.exeter.json',
                'TweakOrder': 0,
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

task format {
    description = 'Formats all Java source files using google-java-format'
    group = 'formatting'
    def jar = layout.buildDirectory.file('google-java-format.jar')

    doFirst {
        if (!jar.get().asFile.exists()) {
            ant.get(src: 'https://github.com/google/google-java-format/releases/download/v1.19.2/google-java-format-1.19.2-all-deps.jar',
                    dest: jar.get().asFile.absolutePath)
        }
    }

    doLast {
        def jarPath = jar.get().asFile.absolutePath
        fileTree('src/main/java').matching { include '**/*.java' }.each { file ->
            def proc = ['java', '-jar', jarPath, '--replace', file.absolutePath].execute()
            proc.waitFor()
            if (proc.exitValue() != 0) {
                throw new GradleException("Failed to format ${file.name}: ${proc.errorStream.text}")
            }
        }
    }
}
