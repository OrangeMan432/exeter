plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

group project.modGroup
version project.modVersion

base {
    archivesName = project.modBaseName
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

def git(String... args) {
    try {
        def pb = new ProcessBuilder(["git"] + (args as List))
        pb.directory(projectDir)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        def output = new String(proc.inputStream.readAllBytes()).trim()
        proc.waitFor()
        return proc.exitValue() == 0 ? output : null
    } catch (ignored) {
        return null
    }
}

def getHash() {
    def gitFolder = "$projectDir/.git/"
    def takeFromHash = 16
    def head = new File(gitFolder + "HEAD").text.split(":") // .git/HEAD
    def isCommit = head.length == 1

    if(isCommit) return head[0].trim().take(takeFromHash)

    def refHead = new File(gitFolder + head[1].trim())
    refHead.text.trim().take takeFromHash
}
String hash = getHash()

def getBuild() {
    String tag = git("tag")
    if (tag != null && tag.contains("\n")) {
        tag = tag.split("\n")[0]
    }
    String commitSinceTag = tag != null ? git("rev-list", "${tag}..HEAD", "--count") : null
    return "${tag ?: 'unknown'}+${commitSinceTag ?: '0'}"
}
String build = getBuild()

compileJava {
    // from sn0w
    String contents = ""
    File update = file 'src/main/java/me/friendly/exeter/core/Exeter.java'
    contents = update.getText( 'UTF-8' )
    contents = contents.replaceAll( 'HASH = "(.*?)"', 'HASH = "' + hash + '"' )
    contents = contents.replaceAll( 'BUILD = "(.*?)"', 'BUILD = "' + build + '"' )
    update.write( contents, 'UTF-8' )
}

repositories {
    mavenCentral()
    maven {
        name = 'fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/maven/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.moandjiezana.toml:toml4j:0.7.2"
    compileOnly "com.googlecode.json-simple:json-simple:1.1.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(
                'MixinConfigs': 'mixins.exeter.json',
                'TweakOrder': 0,
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
