plugins {
    id 'fabric-loom' version '1.13.3'
    id 'maven-publish'
}

group project.modGroup
version project.modVersion

base {
    archivesName = project.modBaseName
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

def execute(String cmd) {
    // from shoreline
    try {
        final def stdout = new ByteArrayOutputStream()

        exec {
            commandLine cmd.split(" ")
            standardOutput = stdout
        }

        return stdout.toString().trim()
    } catch (ignored) {
        return null
    }
}

def getHash() {
    def gitFolder = "$projectDir/.git/"
    def takeFromHash = 16
    def head = new File(gitFolder + "HEAD").text.split(":") // .git/HEAD
    def isCommit = head.length == 1

    if(isCommit) return head[0].trim().take(takeFromHash)

    def refHead = new File(gitFolder + head[1].trim())
    refHead.text.trim().take takeFromHash
}
String hash = getHash()

def getBuild() {
    String tag = execute("git tag")
    String commitSinceTag = execute("git rev-list ${tag}..HEAD --count")
    return "${tag}+${commitSinceTag}"
}
String build = getBuild()

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    // from sn0w
    String contents = ""
    File update = file 'src/main/java/me/friendly/exeter/core/Exeter.java'
    contents = update.getText( 'UTF-8' )
    contents = contents.replaceAll( 'HASH = "(.*?)"', 'HASH = "' + hash + '"' )
    contents = contents.replaceAll( 'BUILD = "(.*?)"', 'BUILD = "' + build + '"' )
    update.write( contents, 'UTF-8' )
}

repositories {
    mavenCentral()
    maven {
        name = 'fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/maven/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "com.googlecode.json-simple:json-simple:1.1.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes(
                'MixinConfigs': 'mixins.exeter.json',
                'TweakOrder': 0,
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
